name: Build Release

on:
  release:
    types: [published]

jobs:
  # -------------------------------------------------------------------------
  # macOS — golden path (VST3 + AU zip + .pkg). Keep this job stable.
  # -------------------------------------------------------------------------
  build-macOS:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache JUCE FetchContent
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-juce-8.0.14-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-juce-8.0.14-

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j8 --config Release

      - name: Package (zip)
        run: |
          cd build/ZooTron_artefacts/Release
          zip -r ../../../Zoo-Tron-III-macOS.zip AU/ VST3/

      - name: Package (installer .pkg)
        run: ./scripts/build-installer-pkg.sh --version ${{ github.event.release.tag_name }}

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zoo-Tron-III-macOS
          path: Zoo-Tron-III-macOS.zip

      - name: Upload pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zoo-Tron-III-macOS-Installer
          path: release-artefacts/Zoo-Tron-III-macOS-Installer.pkg

  # -------------------------------------------------------------------------
  # Windows — VST3 only
  # -------------------------------------------------------------------------
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache JUCE FetchContent
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-juce-8.0.14-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-juce-8.0.14-

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j8 --config Release

      - name: Package (zip)
        shell: bash
        run: |
          cd build/ZooTron_artefacts/Release
          7z a -tzip ../../../Zoo-Tron-III-Windows.zip VST3/

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zoo-Tron-III-Windows
          path: Zoo-Tron-III-Windows.zip

  # -------------------------------------------------------------------------
  # Linux — VST3 only
  # -------------------------------------------------------------------------
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libasound2-dev \
            libjack-jackd2-dev \
            ladspa-sdk \
            libcurl4-openssl-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libxi-dev \
            libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev \
            mesa-common-dev \
            libegl-dev

      - name: Cache JUCE FetchContent
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-juce-8.0.14-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-juce-8.0.14-

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j8 --config Release

      - name: Package (zip)
        run: |
          cd build/ZooTron_artefacts/Release
          zip -r ../../../Zoo-Tron-III-Linux.zip VST3/

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zoo-Tron-III-Linux
          path: Zoo-Tron-III-Linux.zip

  # -------------------------------------------------------------------------
  # Publish: always ship macOS if it succeeded; attach Win/Linux when present
  # -------------------------------------------------------------------------
  create-release:
    name: Create Release Assets
    needs: [build-macOS, build-windows, build-linux]
    if: always() && needs.build-macOS.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS zip
        uses: actions/download-artifact@v4
        with:
          name: Zoo-Tron-III-macOS
          path: ./artifacts

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: Zoo-Tron-III-macOS-Installer
          path: ./artifacts

      - name: Download Windows zip
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: Zoo-Tron-III-Windows
          path: ./artifacts

      - name: Download Linux zip
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: Zoo-Tron-III-Linux
          path: ./artifacts

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
